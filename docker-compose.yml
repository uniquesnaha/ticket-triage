version: "3.9"

services:
  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/app:/app/app  # hot reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""          # Empty = use Vite proxy
      VITE_API_KEY: "${TRIAGE_API_KEY}"
    volumes:
      - ./frontend/src:/app/src  # hot reload
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
