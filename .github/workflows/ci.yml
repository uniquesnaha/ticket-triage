name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend — Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check app/ tests/

      - name: Type check (mypy)
        run: python -m mypy app/
        continue-on-error: true

      - name: Run tests
        env:
          GROQ_API_KEY: "test-groq-key-12345"
          XAI_API_KEY: "test-key-12345"
          TRIAGE_API_KEY: "test-triage-key-12345"
          ENVIRONMENT: testing
          ALLOWED_HOSTS: "localhost,testserver,*"
        run: python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
        continue-on-error: true

  frontend-check:
    name: Frontend — Type Check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        env:
          VITE_API_URL: "http://localhost:8000"
          VITE_API_KEY: "test-key"
        run: npm run build
