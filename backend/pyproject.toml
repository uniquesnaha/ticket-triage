[project]
name = "ticket-triage-backend"
version = "1.0.0"
description = "Production-grade AI-powered support ticket triage API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "C4", "PTH"]
ignore = ["S101", "S603", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml -v"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]
